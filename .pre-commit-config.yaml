# Pre-commit hooks for the agent-memory research repo.
# Install with: pre-commit install

repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        # Strip outputs from any .ipynb files before commit. Jupytext
        # workflow means we mostly commit .py files, but this is a
        # safety net for accidentally-tracked notebooks.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=10000']  # papers/ folder has PDFs up to ~10MB
