[project]
name = "agent-memory-research"
version = "0.1.0"
description = "Research notes and experiments for LLM agent memory mechanisms"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Jupyter + Jupytext workflow
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "jupytext>=1.16",
    "ipykernel>=6.0",

    # Numerical and data
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "plotly>=5.18",

    # Embeddings
    "torch>=2.1",
    "transformers>=4.40",
    "sentence-transformers>=3.0",

    # Clustering / dimensionality reduction
    "umap-learn>=0.5",
    "hdbscan>=0.8",

    # LLM API clients (for memory-systems experiments)
    "openai>=1.30",
    "anthropic>=0.30",
]

[dependency-groups]
dev = [
    "pre-commit>=3.0",
    "nbstripout>=0.7",
]

[tool.uv]
package = false
